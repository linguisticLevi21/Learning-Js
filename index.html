<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body style="background-color: #b2c297;">
    <div id = "first">
        <h1>Calculator</h1>
        <p>This is a simple calculator.</p>
        <p>Enter your numbers and operation</p>
         <div id="Second" , style="background-color: #b2c297;"height="100px", width="200px">
            <input type="text" id="display" style="width: 100%; height: 100%; font-size: 24px; text-align: right;" readonly>
            
        </div>
        <button id="Answer" style="background-color: #4CAF50; color: rgb(7, 7, 7);",size="100px">=</button>
    </div>
        <button id="add" style="background-color: #4CAF50; color: white;">+</button>
        <button id="subtract" style="background-color: #f44336; color: white;">-</button>
        <button id="multiply" style="background-color: #2196F3; color: white;">*</button>
        <button id="divide" style="background-color: #FF9800; color: white;">/</button>
        <button id="clear" style="background-color: #9E9E9E; color: white;">Clear</button>
        <button id="equals" style="background-color: #4CAF50; color: white;">=</button>
        <button id="decimal" style="background-color: #FFEB3B; color: black;">.</button>
        <button id="backspace" style="background-color: #f44336; color: white;">Back</button>
        <button id="number1" style="background-color: #E0E0E0; color: black;">1</button>
        <button id="number2" style="background-color: #E0E0E0; color: black;">2</button> 
        <button id="number3" style="background-color: #E0E0E0; color: black;">3</button> 
        <button id="number4" style="background-color: #E0E0E0; color: black;">4</button> 
        <button id="number5" style="background-color: #E0E0E0; color: black;">5</button> 
        <button id="number6" style="background-color: #E0E0E0; color: black;">6</button> 
        <button id="number7" style="background-color: #E0E0E0; color: black;">7</button> 
        <button id="number8" style="background-color: #E0E0E0; color: black;">8</button> 
        <button id="number9" style="background-color: #E0E0E0; color: black;">9</button> 
        <button id="number0" style="background-color: #E0E0E0; color: black;">0</button>  
    </div>
</body>
</html>
